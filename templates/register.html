<body>
    <h1>Register NRIIT Learning Managemant System</h1>

    <hr>
    <nav>
        <a href="/">Home</a>

    </nav>
    <hr>
</header>
<main>
    <h2>Student Registration</h2>
    <form id="registerForm" >
        <label>Full Name</label>
        <input type="text" placeholder="Enter Your Name" id="name"><br><br>
        <label>Email</label>
        <input type="email" placeholder="Enter Your Email" id="email"><br><br>
        <label>Password</label>
        <input type="password" placeholder="Enter Your Password" id="password"><br><br>
        <label>Date of Birth</label>
        <input type="date" id="date><br><br>
        <label>Gender</label>
        <input type="radio" name="Gender" value="male" id="male">Male
        <input type="radio" name="Gender" value="female" id="female">Female
        <br><br>
        <label>Select Course</label>
        <select id="course" name="course">
            <option value="python">PythonFullStack</option>
            <option value="java">Java FullStack</option>
            <option value="datascience">Data Science</option>
        </select>
        <br><br>
        <button type="Submit" value="register">Register</button>
    </form>
</main>
